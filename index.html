<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d4f73" />
  <title>Cafe Park Hassa | Dijital Menü</title>
  <style>
    :root{
      --primary:#0d4f73;
      --primary2:#1679a5;
      --bg:#f4f7f9;
      --card:#ffffff;
      --text:#17232b;
      --muted:#6c7a84;
      --line:#e6edf1;
      --accent:#f0b44d;
      --shadow:0 10px 30px rgba(13,79,115,.10);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .hero{
      padding:28px 18px 22px;
      background:linear-gradient(135deg,var(--primary),var(--primary2));
      color:#fff;
      border-radius:0 0 28px 28px;
      box-shadow:var(--shadow);
    }
    .hero-inner{max-width:760px;margin:auto}
    .brand-row{display:flex;align-items:center;gap:14px}
    .logo{
      width:64px;height:64px;border-radius:50%;
      background:#fff;
      display:grid;place-items:center;
      color:var(--primary);
      font-weight:900;
      font-size:21px;
      letter-spacing:-1px;
      border:3px solid rgba(255,255,255,.65);
      box-shadow:0 8px 20px rgba(0,0,0,.15);
      flex:0 0 auto;
    }
    h1{font-size:27px;line-height:1.05;margin:0}
    .subtitle{margin:6px 0 0;opacity:.9;font-size:14px}
    .hero-note{
      margin-top:18px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.18);
      border-radius:16px;
      padding:12px 14px;
      font-size:13px;
    }
    .sticky{
      position:sticky;top:0;z-index:10;
      background:rgba(244,247,249,.94);
      backdrop-filter:blur(12px);
      border-bottom:1px solid rgba(0,0,0,.04);
      padding:10px 0;
    }
    .cats{
      display:flex;gap:8px;overflow-x:auto;
      padding:0 14px;
      scrollbar-width:none;
      max-width:850px;margin:auto;
    }
    .cats::-webkit-scrollbar{display:none}
    .cats a{
      text-decoration:none;
      white-space:nowrap;
      color:var(--primary);
      background:#fff;
      border:1px solid #dce7ed;
      padding:9px 13px;
      border-radius:999px;
      font-size:13px;font-weight:700;
      box-shadow:0 3px 10px rgba(0,0,0,.03);
    }
    .container{max-width:760px;margin:18px auto 100px;padding:0 14px}
    .search{
      position:relative;margin:12px 0 18px;
    }
    .search input{
      width:100%;border:none;outline:none;background:#fff;
      padding:15px 44px 15px 16px;border-radius:16px;
      box-shadow:var(--shadow);font-size:15px;color:var(--text);
    }
    .search span{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:18px}
    section{scroll-margin-top:70px;margin:24px 0}
    .section-title{
      display:flex;align-items:center;justify-content:space-between;
      margin:0 4px 10px;
    }
    .section-title h2{
      margin:0;font-size:18px;color:var(--primary);
      letter-spacing:.2px;
    }
    .count{font-size:12px;color:var(--muted)}
    .list{
      background:var(--card);
      border-radius:20px;
      overflow:hidden;
      box-shadow:var(--shadow);
      border:1px solid #eef2f4;
    }
    .item{
      display:flex;align-items:center;justify-content:space-between;
      gap:12px;padding:14px 15px;border-bottom:1px solid var(--line);
    }
    .item:last-child{border-bottom:0}
    .name{font-size:15px;font-weight:700;line-height:1.25}
    .desc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
    .price{
      min-width:74px;text-align:right;
      color:var(--primary);font-weight:900;font-size:16px;
    }
    .special{
      background:linear-gradient(135deg,#fff8ea,#fff);
    }
    .special .price{color:#a35e00}
    .footer{
      position:fixed;left:0;right:0;bottom:0;z-index:20;
      padding:10px 14px calc(10px + env(safe-area-inset-bottom));
      background:linear-gradient(to top,rgba(244,247,249,1) 75%,rgba(244,247,249,0));
    }
    .footer-inner{
      max-width:760px;margin:auto;
      background:var(--primary);color:white;border-radius:18px;
      padding:12px 16px;text-align:center;font-size:13px;
      box-shadow:0 10px 30px rgba(13,79,115,.25);
    }
    .hidden{display:none!important}
    @media(min-width:700px){
      .hero{padding-top:38px}
      h1{font-size:34px}
      .logo{width:76px;height:76px;font-size:25px}
      .container{padding:0 18px}
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="brand-row">
        <div class="logo">CP</div>
        <div>
          <h1>Cafe Park</h1>
          <div class="subtitle">15 Kasım Gürhan Ergüneş Parkı • Hassa</div>
        </div>
      </div>
      <div class="hero-note">Menümüzü aşağıdan inceleyebilirsiniz. Fiyatlar TL cinsindendir.</div>
    </div>
  </header>

  <nav class="sticky">
    <div class="cats" id="cats"></div>
  </nav>

  <main class="container">
    <div class="search">
      <input id="searchInput" type="search" placeholder="Menüde ara… örn. latte, çay, frozen" autocomplete="off">
      <span>⌕</span>
    </div>
    <div id="menu"></div>
  </main>

  <div class="footer">
    <div class="footer-inner">Cafe Park Hassa • Afiyet olsun ☕</div>
  </div>

<script>
const menuData = [
  {
    category:"Sıcak İçecekler",
    items:[
      ["Çay","10"],
      ["Fincan Çay","30"],
      ["Sıcak Su","20"],
      ["Sıcak Süt","60"],
      ["Sıcak Çikolata","70"],
      ["Salep","70"]
    ]
  },
  {
    category:"Sıcak Kahveler",
    items:[
      ["Türk Kahvesi","75"],
      ["Sütlü Türk Kahvesi","70"],
      ["Dibek Kahvesi","60"],
      ["Menengiç Kahvesi","60"],
      ["Nescafe","50"],
      ["Sütlü Nescafe","60"],
      ["Espresso","70"],
      ["Double Espresso","90"],
      ["Americano","90"],
      ["Ristretto","70"],
      ["Demlik Kahve","80"],
      ["Coffee / Kahve","80"],
      ["Kahve x2","110"],
      ["Cappuccino","100"],
      ["Double Cappuccino","120"],
      ["Latte Macchiato","110"],
      ["Double Latte Macchiato","130"],
      ["Flat White","110"],
      ["Flat White x2","130"],
      ["Sıcak Krema","60"]
    ]
  },
  {
    category:"Soğuk Kahveler",
    items:[
      ["Ice Americano","80"],
      ["Ice Latte","90"],
      ["Ice Mocha","100"],
      ["Ice Caramel Latte","100"],
      ["Ice White Chocolate","100"],
      ["Frappe","100"]
    ]
  },
  {
    category:"Bitki Çayları",
    items:[
      ["Nane Limon","60"],
      ["Ihlamur","60"],
      ["Ada Çayı","60"],
      ["Kuşburnu","60"],
      ["Yeşil Çay","60"],
      ["Papatya","60"],
      ["Melisa","60"]
    ]
  },
  {
    category:"Limonatalar",
    items:[
      ["Limonata • Limon","30"],
      ["Limonata • Vişne","30"]
    ]
  },
  {
    category:"Frozen",
    items:[
      ["Frozen • Çilek & Karpuz","170"],
      ["Frozen • Limon","170"],
      ["Frozen • Portakal","170"],
      ["Frozen • Mango","170"],
      ["Frozen • Blue Berry / Orman Meyvesi","170"]
    ]
  },
  {
    category:"Milkshake",
    items:[
      ["Çilekli Milkshake","170"],
      ["Çikolatalı Milkshake","170"],
      ["Muzlu Milkshake","170"]
    ]
  },
  {
    category:"Özel İçecekler",
    items:[
      ["Cafe Park Special","180","Karadut, passion fruit, limon, çilek ve portakal"],
      ["Cafe Park Çocuk Special","—","Ananas ve blue curaçao aromalı çocuk kokteyli"]
    ]
  },
  {
    category:"Soğuk İçecekler",
    items:[
      ["Sıkma Portakal","150"],
      ["Buzlaş Çeşitleri","40"]
    ]
  },
  {
    category:"Su & Soda",
    items:[
      ["Su 0.5 L","10"],
      ["Su 1.5 L","20"],
      ["Sade Soda","20"]
    ]
  },
  {
    category:"Atıştırmalıklar",
    items:[
      ["Popcorn","40"]
    ]
  }
];

const slug = s => s.toLocaleLowerCase('tr-TR')
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c')
  .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');

const cats = document.getElementById('cats');
const menu = document.getElementById('menu');

menuData.forEach((group, i)=>{
  const id = slug(group.category);
  const a = document.createElement('a');
  a.href = '#'+id;
  a.textContent = group.category;
  cats.appendChild(a);

  const section = document.createElement('section');
  section.id = id;
  section.dataset.category = group.category.toLocaleLowerCase('tr-TR');
  section.innerHTML = `
    <div class="section-title">
      <h2>${group.category}</h2>
      <span class="count">${group.items.length} ürün</span>
    </div>
    <div class="list"></div>`;
  const list = section.querySelector('.list');
  group.items.forEach(item=>{
    const row = document.createElement('div');
    row.className = 'item' + (group.category === 'Özel İçecekler' ? ' special' : '');
    row.dataset.search = (item[0]+' '+(item[2]||'')+' '+group.category).toLocaleLowerCase('tr-TR');
    row.innerHTML = `
      <div>
        <div class="name">${item[0]}</div>
        ${item[2] ? `<div class="desc">${item[2]}</div>` : ''}
      </div>
      <div class="price">${item[1] === '—' ? '—' : item[1]+' ₺'}</div>`;
    list.appendChild(row);
  });
  menu.appendChild(section);
});

document.getElementById('searchInput').addEventListener('input', e=>{
  const q = e.target.value.trim().toLocaleLowerCase('tr-TR');
  document.querySelectorAll('section').forEach(section=>{
    let visible = 0;
    section.querySelectorAll('.item').forEach(item=>{
      const show = !q || item.dataset.search.includes(q);
      item.classList.toggle('hidden', !show);
      if(show) visible++;
    });
    section.classList.toggle('hidden', visible===0);
    section.querySelector('.count').textContent = visible+' ürün';
  });
});
</script>
</body>
</html>
