<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f4f39">
  <title>Cafe Park Menü Yönetimi</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div id="loginView" class="login-box">
    <div class="panel">
      <div class="login-title">
        <div class="brand" style="justify-content:center">
          <img src="../assets/logo.png" alt="Logo">
          <div><b>Cafe Park Yönetim</b></div>
        </div>
      </div>
      <form id="loginForm">
        <div class="field">
          <label>E-posta</label>
          <input id="email" type="email" required>
        </div>
        <div class="field">
          <label>Şifre</label>
          <input id="password" type="password" required>
        </div>
        <div class="actions">
          <button class="btn primary" type="submit">Giriş Yap</button>
        </div>
        <div id="loginMsg" class="small"></div>
      </form>
    </div>
  </div>

  <div id="appView" class="hidden">
    <div class="top">
      <div class="inner">
        <div class="brand">
          <img src="../assets/logo.png" alt="Logo">
          <div><b>Cafe Park Menü Yönetimi</b></div>
        </div>
        <div class="actions">
          <button id="newBtn" class="btn ghost" type="button">+ Yeni</button>
          <button id="logout" class="btn danger" type="button">Çıkış</button>
        </div>
      </div>
    </div>

    <main class="wrap page">
      <div class="panel">
        <form id="form">
          <div class="row two">
            <div class="field">
              <label>Ürün adı</label>
              <input id="name" required>
            </div>
            <div class="field">
              <label>Kategori</label>
              <input id="category" list="cats" required>
              <datalist id="cats">
                <option>Sıcak İçecekler</option>
                <option>Sıcak Kahveler</option>
                <option>Soğuk Kahveler</option>
                <option>Bitki Çayları</option>
                <option>Limonatalar</option>
                <option>Frozen</option>
                <option>Milkshake</option>
                <option>Özel İçecekler</option>
                <option>Soğuk İçecekler</option>
                <option>Su & Soda</option>
                <option>Atıştırmalıklar</option>
              </datalist>
            </div>
          </div>

          <div class="row three">
            <div class="field">
              <label>Fiyat (₺)</label>
              <input id="price" type="number" min="0" step="1" required>
            </div>
            <div class="field">
              <label>Sıra</label>
              <input id="sort" type="number" value="10">
            </div>
            <div class="field">
              <label>Fotoğraf</label>
              <input id="image" type="file" accept="image/*">
            </div>
          </div>

          <div class="field">
            <label>Fotoğraf önizleme</label>
            <div class="actions">
              <img id="imagePreview" class="thumb" alt="Önizleme">
              <button id="removeImageBtn" class="btn ghost hidden" type="button">Fotoğrafı Kaldır</button>
            </div>
            <div class="small">Fotoğraf otomatik küçültülür ve Firestore içine kaydedilir.</div>
          </div>

          <div class="field">
            <label>Açıklama</label>
            <textarea id="description"></textarea>
          </div>

          <div class="checks">
            <label><input id="active" type="checkbox" checked> Menüde göster</label>
            <label><input id="featured" type="checkbox"> Öne çıkar</label>
          </div>

          <div class="actions">
            <button id="saveBtn" class="btn primary" type="submit">Ürünü Kaydet</button>
            <button id="deleteBtn" class="btn danger hidden" type="button">Sil</button>
            <button id="seedBtn" class="btn gold" type="button">Başlangıç Menüsünü Yükle</button>
          </div>

          <div id="status" class="status"></div>
        </form>
      </div>

      <div id="items" class="list"></div>
    </main>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
